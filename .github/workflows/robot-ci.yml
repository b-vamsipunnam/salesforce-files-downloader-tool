name: Robot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t salesforce-files-downloader:test .

      - name: Check Python version
        run: docker run --rm --entrypoint python salesforce-files-downloader:test --version

      - name: Check Robot Framework version
        run: |
          docker run --rm --entrypoint python salesforce-files-downloader:test \
            -c "import robot; print(robot.__version__)"

      - name: Check Chrome version
        run: docker run --rm --entrypoint google-chrome salesforce-files-downloader:test --version

      - name: Verify non-root runtime identity
        run: |
          test "$(docker run --rm --entrypoint id salesforce-files-downloader:test -u)" = "10001"

      - name: Verify sandboxed Chrome startup
        run: |
          docker run --rm \
            --shm-size=2g \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            --entrypoint google-chrome \
            salesforce-files-downloader:test \
            --headless=new \
            --disable-gpu \
            --dump-dom \
            about:blank

      - name: Verify mount permissions and host persistence
        run: |
          runtime_dir="$(mktemp -d)"
          mkdir -p \
            "$runtime_dir/input" \
            "$runtime_dir/downloads" \
            "$runtime_dir/artifacts" \
            "$runtime_dir/results"
          chmod 777 \
            "$runtime_dir/downloads" \
            "$runtime_dir/artifacts" \
            "$runtime_dir/results"
          printf '{"result":{}}' > "$runtime_dir/org_info.json"

          docker run --rm \
            --entrypoint sh \
            --mount "type=bind,src=$runtime_dir/org_info.json,dst=/app/org_info.json,readonly" \
            --mount "type=bind,src=$runtime_dir/input,dst=/app/input,readonly" \
            --mount "type=bind,src=$runtime_dir/downloads,dst=/app/downloads" \
            --mount "type=bind,src=$runtime_dir/artifacts,dst=/app/artifacts" \
            --mount "type=bind,src=$runtime_dir/results,dst=/app/results" \
            salesforce-files-downloader:test \
            -c 'set -eu
              if touch /app/input/must-fail; then exit 1; fi
              if printf x >> /app/org_info.json; then exit 1; fi
              touch /app/downloads/persisted
              touch /app/artifacts/persisted
              touch /app/results/persisted'

          test -f "$runtime_dir/downloads/persisted"
          test -f "$runtime_dir/artifacts/persisted"
          test -f "$runtime_dir/results/persisted"

      - name: Verify runtime secrets are absent from image
        run: |
          docker run --rm --entrypoint sh salesforce-files-downloader:test \
            -c 'test ! -e /app/org_info.json && ! find /app -type f -name "*.auth.json" -print -quit | grep -q .'

      - name: Run container smoke tests
        run: |
          docker run --rm --entrypoint python salesforce-files-downloader:test \
            -m unittest discover -s ci/tests -v
          docker run --rm --entrypoint robot salesforce-files-downloader:test \
            --outputdir /tmp/robot-smoke ci/robot/smoke.robot

  robot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # Configure Python and dependency caching
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Create directories used by the framework, and CI reports
      - name: Prepare directories
        run: |
          mkdir -p results/smoke
          mkdir -p input artifacts downloads

      # GitHub's Ubuntu runner includes Google Chrome
      - name: Check Chrome
        run: google-chrome --version

      # Install and validate project dependencies
      - name: Install dependencies
        run: |
          python --version
          python -m pip --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      # Make local Robot Framework Python libraries importable
      - name: Set PYTHONPATH
        run: |
          echo "PYTHONPATH=${GITHUB_WORKSPACE}/src/robot/libraries:${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"

      # Strict, unauthenticated framework smoke tests
      - name: Run CI smoke tests
        run: |
          python -m unittest discover -s ci/tests -v
          robot \
            --outputdir results/smoke \
            --loglevel INFO \
            ci/robot/smoke.robot

      # Display generated results for troubleshooting
      - name: List results
        if: always()
        run: |
          echo "Results content:"
          ls -la results || true

          echo "Smoke results:"
          ls -la results/smoke || true

      # Remove sensitive runtime files before artifact collection
      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f org_info.json

      # Preserve smoke-test reports even when a test fails
      - name: Upload smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-smoke-results-py${{ matrix.python-version }}
          path: results/smoke
          if-no-files-found: ignore
          retention-days: 7

  windows-library-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Run static analysis
        run: |
          ruff check src ci
          robocop check src ci

      - name: Run Windows library tests
        run: |
          python -m unittest discover -s ci/tests -v
          robot --dryrun --output NONE --log NONE --report NONE ci/robot/smoke.robot
